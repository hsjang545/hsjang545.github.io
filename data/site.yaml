    short: {ko: 차량용 반도체 검증, en: Semiconductor verification}
    figures:
      - file: can.jpg
        caption: {ko: "CAN-FD 오류 주입 파형 (KSAE 2025)", en: "CAN-FD fault injection waveforms (KSAE 2025)"}
    title: {ko: 차량용 반도체 검증, en: Automotive semiconductor verification}
    period: 2023 – 2025
    body:
      ko: 차세대 ETC 반도체의 HSM, AES-128·SHA-256, CAN-FD 오류 내성 검증.
      en: HSM, AES-128/SHA-256 and CAN-FD fault tolerance verification for a next-generation ETC semiconductor.
    projects: [proj-etc-soc]
    publications: [pub-ksae-2025-canfd, pub-ksae-2024-etc-req]
    patents: [pat-semiconductor-comm]
  - id: slam
