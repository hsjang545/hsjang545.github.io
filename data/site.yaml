intro:
  headline: {ko: "ADAS 실차 검증, 프리크래시 통합안전", en: "ADAS vehicle validation, pre-crash integrated safety"}
  role: {ko: 한국자동차연구원 데이터플랫폼연구센터 연구원, en: "Researcher, Data Platform R&D Center, Korea Automotive Technology Institute (KATECH)"}

research:
  - id: adas-validation
    short: {ko: ADAS 실차 검증, en: ADAS validation}
    span: [2023-02, present]
    figures:
      - file: aeb.jpg
        caption: {ko: "AEB 실험 환경 (KSAE 2025)", en: "AEB test setup (KSAE 2025)"}
    title: {ko: ADAS 실차 검증, en: ADAS vehicle validation}
    period: 2023 –
    body:
      ko: 법규, NCAP, 완성차 요구사항 기반 양산 ADAS 시험장 검증.
      en: Proving ground validation of production ADAS against regulations, NCAP and OEM requirements.
    projects: [proj-multicore-soc, proj-pmaps, proj-mpc55-adas]
    publications: [pub-ksae-2025-edgecase]
    patents: []
  - id: integrated-safety
    short: {ko: 프리크래시 통합안전, en: Pre-crash integrated safety}
    span: [2025-02, present]
    title: {ko: 프리크래시 통합안전, en: Pre-crash integrated safety}
    period: 2025 –
    body:
      ko: 능동·수동 안전을 잇는 충돌 예측, 탑승자 거동 모니터링, 다단계 안전벨트 제어.
      en: Collision prediction, occupant monitoring and multi-stage seat belt control, connecting active and passive safety.
    projects: [proj-occupant-msb, proj-precrash]
    publications: []
    patents: [pat-occupant-restraint]
  - id: data-acquisition
    short: {ko: 실차 데이터 취득, en: Vehicle data acquisition}
    span: [2025-02, present]
    project_links: [proj-precrash]
    title: {ko: 실차 멀티모달 데이터 취득, en: Multi-modal vehicle data acquisition}
    period: 2025 –
    body:
      ko: 카메라, 레이더, INS, CAN-FD, 인캐빈 센서를 ROS 2로 동기화하는 GV70 기반 플랫폼 구축.
      en: GV70-based platform synchronizing camera, radar, INS, CAN-FD and in-cabin sensors with ROS 2.
    projects: []
    publications: []
    patents: []
  - id: coordination
    short: {ko: 돌발상황 경로조율, en: Incident coordination}
    span: [2023-02, 2025-05]
    figures:
      - file: trajectory.jpg
        caption: {ko: "실제 궤적(노랑)과 증강 궤적(파랑). IEEE Access 2025, CC BY 4.0", en: "Real (yellow) and augmented (blue) trajectories. IEEE Access 2025, CC BY 4.0"}
    title: {ko: 돌발상황 경로조율과 궤적 데이터, en: Incident coordination and trajectory data}
    period: 2023 – 2025
    body:
      ko: 혼합 교통 돌발상황의 통행조율, 평가 시나리오, 차량 궤적 증강.
      en: Traffic coordination, evaluation scenarios and trajectory augmentation for incidents in mixed traffic.
    projects: [proj-incident-control]
    publications: [pub-access-2025, pub-iccad-2023, pub-ksae-2024-coordination, pub-ksae-2023-rules, pub-ksae-2023-mas, pub-ksae-2023-data]
    patents: [pat-avoidance-path, pat-traffic-flow-pct, pat-traffic-flow-kr]
  - id: semiconductor
    short: {ko: 차량용 반도체 검증, en: Semiconductor verification}
    span: [2023-04, 2025-12]
    figures:
      - file: can.jpg
        caption: {ko: "CAN-FD 오류 주입 파형 (KSAE 2025)", en: "CAN-FD fault injection waveforms (KSAE 2025)"}
    title: {ko: 차량용 반도체 검증, en: Automotive semiconductor verification}
    period: 2023 – 2025
    body:
      ko: 차세대 ETC 반도체의 HSM, AES-128·SHA-256, CAN-FD 오류 내성 검증.
      en: HSM, AES-128/SHA-256 and CAN-FD fault tolerance verification for a next-generation ETC semiconductor.
    projects: [proj-etc-soc]
    publications: [pub-ksae-2025-canfd, pub-ksae-2024-etc-req]
    patents: [pat-semiconductor-comm]
  - id: slam
    short: {ko: "석사: SLAM, 센서 융합", en: "M.S.: SLAM, sensor fusion"}
    span: [2021-03, 2023-02]
    figures:
      - file: slam.jpg
        caption: {ko: "SLAM 시스템 구조", en: "SLAM system structure"}
    title: {ko: 석사 연구 - SLAM과 센서 융합, en: "Master's research: SLAM and sensor fusion"}
    period: 2021 – 2023
    body:
      ko: LiDAR, RGB, IMU를 융합한 평생 학습 SLAM.
      en: Continual learning SLAM fusing LiDAR, RGB and IMU.
    projects: [proj-reading-robot]
    publications: [pub-kiise-2023, pub-ksc-2021]
    patents: []
  - id: undergraduate
    short: {ko: "학부: 스마트 소방 헬멧", en: "B.S.: Smart fire helmet"}
    span: [2019-09, 2021-02]
    figures:
      - file: helmet.jpg
        caption: {ko: "헬멧 착용 모습 (KICS 2020)", en: "Helmet in use (KICS 2020)"}
    title: {ko: 학부 연구 - 스마트 소방 헬멧과 자율주행, en: "Undergraduate research: smart fire helmet and autonomous driving"}
    period: 2019 – 2021
    body:
      ko: 열화상 카메라와 증강현실을 적용한 스마트 소방 헬멧 개발.
      en: Smart fire-fighting helmet with a thermal camera and augmented reality.
    projects: []
    publications: [pub-kics-2020-helmet, pub-ksae-2020-filter]
    patents: []

