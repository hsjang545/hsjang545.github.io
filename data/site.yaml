    body:
      ko: 카메라, 레이더, INS, CAN-FD, 인캐빈 센서를 ROS 2로 동기화하는 GV70 기반 플랫폼 구축.
      en: GV70-based platform synchronizing camera, radar, INS, CAN-FD and in-cabin sensors with ROS 2.
    projects: [proj-precrash, proj-camera-5m, proj-nanoheating]
    publications: []
    patents: []
  - id: coordination
    short: {ko: 돌발상황 경로조율, en: Incident coordination}
    figures:
      - file: trajectory.jpg
