    on_intro: false
    short: {ko: "SLAM, 센서 융합", en: "SLAM, sensor fusion"}
    figures:
      - file: slam.jpg
        caption: {ko: "SLAM 시스템 구조", en: "SLAM system structure"}
    title: {ko: SLAM과 센서 융합, en: SLAM and sensor fusion}
    period: 2021 – 2023
    body:
      ko: LiDAR, RGB, IMU를 융합한 평생 학습 SLAM.
      en: Continual learning SLAM fusing LiDAR, RGB and IMU.
    projects: [proj-reading-robot]
    publications: [pub-kiise-2023, pub-ksc-2021]
    patents: []

# 경력·학력 기관 로고. 키는 cv.yaml의 education, experience 항목 key다. size는 표시 크기(가로, 세로 px), mono는 어두운 화면에서 밝게 바꾼다.
org_logos:
  katech: {file: katech.png, size: [140, 26], mono: true, name: {ko: 한국자동차연구원, en: KATECH}}
  gist-ms: {file: gist.svg, size: [39, 36], name: {ko: 광주과학기술원, en: GIST}}
  tuk-bs: {file: tukorea.png, size: [127, 28], mono: true, name: {ko: 한국공학대학교, en: Tech University of Korea}}

# 사이트에 싣지 않는 과제. CV 원본과 PDF에는 남아 있다.
hidden_projects: [proj-special-road]

# 과제 구분. national은 국가과제, contract는 수탁과제다.
project_kinds:
  national: [proj-camera-5m, proj-occupant-msb, proj-nanoheating, proj-multicore-soc, proj-etc-soc, proj-incident-control, proj-reading-robot]
  contract: [proj-precrash, proj-pmaps, proj-mpc55-adas]

# 과제 로고. 파일은 assets/logos/에 둔다. 국가과제는 정부 상징과 부처명(label), 수탁과제는 발주처 로고다.
# mono는 단색 글자 로고라 어두운 화면에서 밝게 바꾼다.
project_logos:
  proj-camera-5m: &motir {file: gov-emblem.svg, name: {ko: 산업통상부, en: Ministry of Trade, Industry and Resources}, label: {ko: 산업통상부, en: MOTIR}}
  proj-occupant-msb: *motir
  proj-nanoheating: *motir
  proj-multicore-soc: *motir
  proj-etc-soc: *motir
  proj-incident-control: {file: gov-emblem.svg, name: {ko: 경찰청, en: Korean National Police Agency}, label: {ko: 경찰청, en: KNPA}}
  proj-reading-robot: {file: gov-emblem.svg, name: {ko: 문화체육관광부, en: Ministry of Culture, Sports and Tourism}, label: {ko: 문화체육관광부, en: MCST}}
  proj-precrash: {file: hyundai.svg, mono: true, name: {ko: 현대자동차, en: Hyundai Motor Company}}
  proj-pmaps: {file: hyundai.svg, mono: true, name: {ko: 현대자동차, en: Hyundai Motor Company}}
  # 발주처 LG전자와 양산차 고객사 다임러를 함께 표시한다. 로고가 여럿이면 목록으로 쓴다.
  proj-mpc55-adas:
    - {file: lg.svg, name: {ko: LG전자, en: LG Electronics}}
    - {file: daimler.svg, mono: true, name: {ko: 다임러, en: Daimler}}

